     stroke="currentColor" stroke-width="6" stroke-linecap="round"
     role="img" aria-label="Water Mill">
  <circle cx="48" cy="48" r="23"/>
    <line x1="48.0" y1="48.0" x2="48.0" y2="25.0"/>
    <line x1="48.0" y1="48.0" x2="67.92" y2="36.5"/>
    <line x1="48.0" y1="48.0" x2="67.92" y2="59.5"/>
    <line x1="48.0" y1="48.0" x2="48.0" y2="71.0"/>
    <line x1="48.0" y1="48.0" x2="28.08" y2="59.5"/>
    <line x1="48.0" y1="48.0" x2="28.08" y2="36.5"/>
    <line x1="39.5" y1="18.0" x2="56.5" y2="18.0"/>
    <line x1="69.73" y1="25.64" x2="78.23" y2="40.36"/>
    <line x1="78.23" y1="55.64" x2="69.73" y2="70.36"/>
    <line x1="56.5" y1="78.0" x2="39.5" y2="78.0"/>
    <line x1="26.27" y1="70.36" x2="17.77" y2="55.64"/>
    <line x1="17.77" y1="40.36" x2="26.27" y2="25.64"/>
  <text x="104" y="58" stroke="none" fill="currentColor"
        font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="2.5">WATER MILL</text>
</svg>
