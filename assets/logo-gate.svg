<!-- Water Mill. Strokes use currentColor, so the mark takes the colour of
     its context and needs no light/dark variant. -->
<!-- Secondary mark: the sluice gate. Flow arrives, the gate decides, less comes
     out than went in -- which is what this orchestrator does to a night's work. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     stroke="currentColor" stroke-width="6.5" stroke-linecap="round"
     role="img" aria-label="Water Mill">
  <path d="M8 25 H37"/>
  <path d="M8 48 H37"/>
  <path d="M8 71 H37"/>
  <path d="M47 9 V87" stroke-width="8.5"/>
  <path d="M57 32 H88"/>
  <path d="M57 64 H88"/>
</svg>
