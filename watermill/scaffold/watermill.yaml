# Water Mill project contract.
#
# This file is the entire coupling surface between the factory and this
# repository. Water Mill knows nothing else about the project.
#
# Unknown keys are refused rather than ignored: a misspelled key is
# indistinguishable from a missing one once a run has started.

version: 1
name: PROJECT_NAME

description: >
  One or two sentences. This is printed in reports, so write it for the person
  reading at 7am who drives four projects and needs to remember which is which.

commands:
  # REQUIRED. The merge gate -- the one command whose result decides whether a
  # task's work is kept. Water Mill runs it twice per task: once as a baseline
  # on unmodified code, once after the agent finishes. It must be the same
  # command CI runs, or a green local run and a red CI run mean nothing
  # together.
  gate: make verify

  # How a fresh checkout becomes runnable. Not run automatically; reported by
  # `watermill doctor` when the gate fails for want of dependencies.
  install: make install

  # OPTIONAL, and the most important optional field here. A command that exits
  # zero when a restore has been *verified* recently -- not when a backup file
  # exists. A run that can damage data without a proven restore is the one
  # combination this whole system exists to prevent, and a project with no
  # backup_check is allowed to run only because refusing outright would stop
  # anyone adopting the factory at all. Preflight says so every time.
  # backup_check: .venv/bin/python scripts/backup_drill.py --check-heartbeat
  # backup_run: make backup && make drill

git:
  base_branch: main

  # `branch` opens watermill/<run-id> and pushes it for review.
  # `direct` commits onto base_branch.
  #
  # Start on `branch`. Direct is the right answer for a mature project with a
  # strong gate, a verified restore and a cheap revert -- but a project the
  # factory has never driven has not yet demonstrated any of the three.
  target: branch
  remote: origin

# What `watermill land` does with the branch a run leaves behind. Optional and
# commented out: without it `land` refuses, and the branch waits for a person.
#
# None of these runs during a run. They talk to a forge, and a forge that is
# slow or down must not be able to hang a night or hold a claimed task open.
#
# `verify` is required as soon as `merge` is set, and the contract refuses the
# combination without it. Merging without verifying makes the merge gate
# advisory -- a check that runs after the decision it exists to inform.
# review:
#   create: gh pr create --base {base} --head {branch} --title {title} --body {body}
#   verify: gh pr checks {branch} --watch --fail-fast
#   merge: gh pr merge {branch} --squash --delete-branch

queue:
  # beads | command | none. `none` disables the queue, which is what a project
  # uses while a human still hands it one task at a time.
  kind: beads
  ready: bd ready --json
  stale: bd list --status in_progress --json
  show: bd show {id}
  claim: bd update {id} --claim
  release: bd update {id} --status open
  close: bd close {id}
  comment: bd comment {id} {text}
  # Rows that are containers rather than work. Handing an epic to an agent
  # produces a task that silently does nothing.
  exclude_types:
    - epic

fence:
  # Paths a task may never modify. Named in the agent's prompt AND checked
  # against the diff afterwards -- an instruction is a request, a diff is
  # evidence. A task that touches one of these has its work discarded whatever
  # else it did.
  #
  # What belongs here: the gate itself and anything that could weaken it, the
  # migration and schema files, whatever encodes the project's hardest-won
  # decisions, and this file.
  paths:
    - watermill.yaml
    - Makefile
    - .github/workflows/
    # - db.py
    # - brain/

environment:
  # Refuse to run when a variable holds a value meaning production. The common
  # ones (FLASK_ENV, NODE_ENV, APP_ENV, ENVIRONMENT, RAILS_ENV) are checked
  # already; add anything this project uses.
  forbid_env: {}
  min_free_gb: 2

notes:
  # Advice carried into the agent's prompt. Everything else in this file is a
  # mechanism -- the gate re-runs, the fence is checked against a diff, a cap
  # halts the loop. This is the one exception, and the boundary matters more
  # than the contents:
  #
  #   A rule that can be mechanised does not belong here. "Never edit db.py" is
  #   a fence path; writing it as a note instead converts an enforced guarantee
  #   into a suggestion the agent may reasonably weigh against its task.
  #
  #   A note earns its place by having cost something. These are written after
  #   a task went wrong, not guessed before one is attempted. A note nobody
  #   learned the hard way is a style preference, and the prompt is not the
  #   place for those.
  #
  # Capped at 20 entries of 500 characters. When the list is full the answer is
  # not a longer list -- it is to promote a note into the gate or the fence.
  #
  # - Integration fixtures live in tests/fixtures, not tests/data. The second
  #   path exists and holds something else.
  # - The dev server holds port 5173; the gate reads a stale build if it is
  #   still running.

caps:
  # Per-project overrides. Omit any of them to take the platform default:
  # 15 tasks, 6 hours, 3 consecutive failures, 30 minute task timeout,
  # 3 unmetered tasks.
  #
  # The spend ceiling is deliberately NOT here. It is an operator decision made
  # per run (`--max-spend`), because a ceiling checked into a repository is one
  # nobody re-reads before the night it matters.
  max_tasks: 15
  max_hours: 6
  task_timeout_minutes: 30
