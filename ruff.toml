# The backend linter's rule set.
line-length = 100
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    # A bare `except Exception` on a cleanup path is deliberate here: release
    # and discard run on the failure and signal paths, which are exactly where
    # raising would strand the thing being cleaned up. Each one is commented.
    "B904",
]

[lint.per-file-ignores]
# Tests name their scenario in the function name; long, explicit assertions
# read better than wrapped ones.
"tests/*" = ["E501"]
# A synced copy cannot be edited here; its managed header, which names the canon
# path, runs past 100 columns. The canon master (canon/project/scripts/beads_merge.py)
# is still width-checked, so do not widen this to all of scripts/.
"scripts/beads_merge.py" = ["E501"]
