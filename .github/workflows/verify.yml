# CI runs `make verify` and nothing else, so a check that passes locally cannot
# fail here for a reason spelled out in this file.
name: verify

# Pull requests only, and a newer push to the same PR cancels the run it
# replaces (owner, 2026-10-15: Actions minutes). Main is not verified again
# after a merge: the lander first makes sure the PR head already holds
# everything main has but bead updates, so the PR's run is of the code main
# will hold (tailrace, step 0b).
on:
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # `make install`, not a bare pip install: the gate runs the interpreter
        # this target populates, so CI and a developer's checkout are the same
        # run. Installing into the system interpreter here is how CI stayed
        # green while `make install && make verify` failed on a clean clone.
        run: make install

      - name: Configure git
        # The engine tests drive real repositories, which need an identity to
        # commit with. Without this every engine test fails on `git commit`.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Water Mill CI"

      - name: make verify
        run: make verify
