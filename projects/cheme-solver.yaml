# ChemE Solver -- a study site for chemical-engineering coursework.
#
# Vendored here like zim-dashboard-demo-cell-1b's contract, and for the same
# reason: the repository has not adopted a `watermill.yaml` of its own (it was
# not stamped from watermill-cell-template and registering it does not change
# that). Once it carries its own watermill.yaml, that file wins over this one;
# delete this then.
#
# Registered 2026-10-13 at the owner's direct request (bead water-mill-m2r)
# after the mill crew had already been working in it (brain/handoffs/mill/).
#
# The fence below was built from reading the repo, not from a template:
# no Gurobi licence or any licence file exists in it (grep finds none); the
# only secret-shaped inputs are the invite code and session settings, read by
# backend/cheme/config.py from environment variables.

version: 1
name: cheme-solver

description: >
  FastAPI + SQLite backend (backend/cheme) with a Vite/React/TypeScript
  frontend. Problem library, step planner and practice generators over
  YAML content in content/books/. Small user base (classmates) behind an
  invite code; deployed by the owner, not by the factory.

commands:
  # content validation + ruff lint/format + pytest, then frontend typecheck,
  # vitest and build. Worktrees have no .venv: pass VENV=/path/to/.venv.
  gate: make verify
  install: make install

git:
  base_branch: main
  target: branch
  remote: origin

# No `review` block, on purpose: cheme-solver has no CI (.github/workflows/
# does not exist), so the zim-dashboard verify step `gh pr checks {branch}
# --watch --fail-fast` can never go green here. It exits 1 at once with "no
# checks reported on the '<branch>' branch" (--watch does not wait for checks
# that never register), `watermill land` retries it for its 90 s settle window,
# then reports a failed verify and never merges -- after `create` has already
# opened a pull request. Omitting the block makes `land` refuse up front
# instead (exit 3, "declares no review.create"), which is the honest answer:
# landing here is supervised -- sluice/tailrace run `make verify` on the branch
# locally and a person or the lander merges. Restore this block, unchanged,
# in the same PR that adds a workflow running `make verify`:
#
# review:
#   create: gh pr create --base {base} --head {branch} --title {title} --body {body}
#   verify: gh pr checks {branch} --watch --fail-fast
#   merge: gh pr merge {branch} --squash --delete-branch

queue:
  kind: beads
  ready: bd ready --json
  stale: bd list --status in_progress --json
  show: bd show {id}
  claim: bd update {id} --claim
  release: bd update {id} --status open
  close: bd close {id}
  comment: bd comment {id} {text}
  exclude_types:
    - epic

fence:
  paths:
    # The gate and CI -- an agent that can edit these can make itself pass.
    # (.github/workflows/ does not exist yet; fenced so it starts fenced.)
    - Makefile
    - .github/workflows/
    # The work graph and doctrine.
    - .beads/
    - CLAUDE.md
    - AGENTS.md
    - brain/
    # Agent/editor config: hooks here run on every session start.
    - .claude/
    - .codex/
    - .agents/
    # PRODUCTION DEPLOY: systemd unit, Caddyfile and cloudflared examples,
    # and the env.example that names the real runtime variables. The unit
    # and Caddy/cloudflared files describe the live host; a change here is a
    # production change.
    - deploy/
    # Deploy runbooks (Pi in DEPLOY.md, Azure VM in DEPLOY-AZURE.md): they
    # carry host names, paths and rollout steps the owner runs by hand.
    - docs/DEPLOY.md
    - docs/DEPLOY-AZURE.md
    # CREDENTIAL / SECRET PATHS. Settings (invite code, cookie secure flag,
    # session days) come from environment variables in config.py; the real
    # .env lives only on the host, at the checkout root (DEPLOY.md:
    # `cp deploy/env.example .env`; the unit's EnvironmentFile). NOTE: the
    # repo's .gitignore does NOT list .env, so the fence is the only thing
    # keeping an agent's commit from carrying one. Fence the reader, the
    # password-hashing and session code, and every env-file spelling.
    # (The session check that enforces sign-in lives in app.py, which is
    # left open because every new router is registered there.)
    - backend/cheme/config.py
    - backend/cheme/auth.py
    - backend/cheme/routes/auth.py
    - .env
    - ".env.*"
    - "*.env"
    - .beads-credential-key
    # The schema: SQLite migrations are append-only and run against real
    # user data on the host; same rule as zimmy's db.py.
    - backend/cheme/db.py
    - backend/cheme/migrations/
    # Runtime state, gitignored, holds real accounts: never an agent's to
    # touch even if it appears in a worktree.
    - var/

environment:
  # The gate runs a frontend build (npm ci) plus pytest.
  min_free_gb: 3

notes:
  - >-
    No Gurobi licence or other licence file exists in the repo; the
    env-only rule for licences still applies if one is ever added.
  - >-
    No CI: there is no .github/workflows/, so a pull request here never has
    checks and `gh pr checks` always fails with "no checks reported". That is
    not a pass. The contract declares no review block, so `watermill land`
    refuses; verify a branch by running `make verify` on it locally before
    anyone merges.

caps:
  max_tasks: 5
  max_hours: 3
  task_timeout_minutes: 30
