# Zimmy Life Tracker -- the factory's first target.
#
# Vendored here rather than living in the project, because the project has not
# adopted a contract yet. Precedence is: a `watermill.yaml` inside the
# repository always wins over this file. Move it there once it has proven
# right, and delete this.
#
# Everything below is drawn from the project's own CLAUDE.md, VERIFY.md,
# BACKUP.md and LOOP.md rather than guessed.

version: 1
name: zimmy-life-tracker

description: >
  Flask + React life tracker on a Raspberry Pi. Single SQLite database, an
  append-only migration list, and a merge gate that runs both linters and both
  test suites in about ninety seconds. The repository on the Pi is the
  production checkout, which is why the environment guards below are not
  theatre.

commands:
  # The project's own merge gate, and exactly what its CI workflow runs -- so a
  # check that passes here cannot fail in CI for a reason spelled out in a YAML
  # file. Guard, frontend build, ruff, ESLint at --max-warnings=0, Vitest,
  # pytest. Roughly 1m31s.
  gate: make verify

  install: make install

  # A heartbeat written only by a drill that actually restored an export into a
  # scratch database and verified it. Not "a backup file exists" -- the drill
  # failed on its first real run and the failure was its own, which is the
  # whole argument for checking the restore rather than the artifact.
  backup_check: .venv/bin/python scripts/backup_drill.py --check-heartbeat
  # Display only: printed in the refusal so the operator knows what to run.
  backup_run: make backup drill

git:
  base_branch: main
  # Branch, not direct, until supervised calibration has run. The project's own
  # LOOP.md argues for direct and is right about a mature setup -- but the
  # argument rests on a revert staying routine, and nobody has reverted one of
  # these yet. Flip this after calibration, deliberately.
  target: branch
  remote: origin

review:
  # The three steps `watermill land` performs, in order. The forge is the
  # project's business and not the orchestrator's, so these are commands rather
  # than a GitHub integration -- `glab`, a curl or a script would serve equally.
  #
  # **None of these runs during a run.** Every one talks to a third party that
  # can be slow, rate-limited or down, and a night that blocked on a CI queue
  # would hold a claimed task open across the outage. Same rule as `ship`.
  create: gh pr create --base {base} --head {branch} --title {title} --body {body}

  # --watch blocks until every check has reported; --fail-fast returns non-zero
  # the moment one fails rather than waiting out the rest of a doomed build.
  # This is the step that decides, and `land` never calls merge without it.
  verify: gh pr checks {branch} --watch --fail-fast

  # Squash, because a run's branch is one task's work however many commits the
  # agent needed to get there, and the task id is in the commit message that
  # survives. Declared, but `watermill land --no-merge` stops before it while
  # the ramp is young -- see docs/SAFETY.md.
  merge: gh pr merge {branch} --squash --delete-branch

queue:
  kind: beads
  ready: bd ready --json
  stale: bd list --status in_progress --json
  show: bd show {id}
  claim: bd update {id} --claim
  release: bd update {id} --status open
  close: bd close {id}
  comment: bd comment {id} {text}
  exclude_types:
    - epic

fence:
  # Every path here is protected for a reason the project already learned the
  # hard way. This is not a generic list.
  paths:
    # The gate and everything that decides what it means. An agent that can
    # edit these can make itself pass.
    - Makefile
    - VERIFY.md
    - ruff.toml
    - .github/workflows/
    - frontend/vite.config.js
    - frontend/eslint.config.js

    # The schema. An index declared in SCHEMA over a column MIGRATIONS adds
    # passes every test locally and crash-loops the Pi on the next restart.
    # MIGRATIONS is append-only and editing an existing entry is unrecoverable.
    - db.py

    # The consolidations. Four disagreeing definitions of "today" became one
    # module and two streak implementations became another; re-introducing a
    # local definition is the exact regression they were built to end.
    - services/clock.py
    - services/streak_service.py

    # Backup and restore. A guarded restore with no override flag is only
    # guarded while nobody adds one.
    - scripts/backup_export.py
    - scripts/backup_restore.py
    - scripts/backup_drill.py
    - BACKUP.md

    # The invariants and the corpus they run over -- the tests that catch what
    # a gate cannot. A task that "fixes" a failing invariant has almost
    # certainly found a real bug.
    - tests/test_invariants.py
    - tests/corpus.py
    - scripts/gen_corpus.py
    - CORPUS.md

    # Doctrine and the work graph. Settled decisions are not a task's to
    # re-litigate, and a queue that can edit itself is not a queue.
    - brain/
    - .beads/
    - AGENTS.md
    - CLAUDE.md

    # Credential redaction. ALL_TABLES, SENSITIVE_KEYS and SENSITIVE_COLUMNS
    # decide what a backup carries in the clear.
    - routes/backup.py

    # Auth and the second factor.
    - services/mfa_service.py
    - config.py

environment:
  forbid_env:
    FLASK_ENV: production
    APP_ENV: production
  min_free_gb: 2

notes:
  # Deliberately empty. A note is written after a task goes wrong in this
  # repository, and no task has been run here -- nights run: 0. Filling this in
  # from the project's CLAUDE.md would put guesses in every prompt and charge
  # for them on every task, and the guesses would be indistinguishable from the
  # lessons once they were in the list.
  #
  # The place they come from is docs/calibration/zimmy-life-tracker.md, after
  # the eight supervised tasks. What can be mechanised goes into fence.paths or
  # the gate first; this is only for what neither can express.

caps:
  # Night one of the ramp: 5 tasks, 3 hours. Raised only after a night with
  # zero reverts and an accurate report. Never raised to compensate for a low
  # task count -- if work is running out, generate more tasks.
  max_tasks: 5
  max_hours: 3
  task_timeout_minutes: 30

knowledge:
  # The context graph as a tool the agent can call mid-task. On, because the
  # seam was proven against a real `claude -p` on 2026-08-30 (run
  # 20260830-090740: one recall call, one proposal filed). `--no-recall`
  # withholds it for a single run.
  recall: true
